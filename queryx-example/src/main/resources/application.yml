    username: root
    password: Bafan@2026xixunxun
    driver-class-name: com.mysql.cj.jdbc.Driver

# QueryX 配置
queryx:
  enabled: true

  # 全局异常处理开关（关闭后请自己重新管理）
  exceptionHandlerEnabled: true

  # 启用排序字段白名单验证（防止 SQL 注入）
  orderByWhitelistEnabled: true
  
  # 允许的排序字段白名单
  orderByWhitelist:
    - id
    - username
    - email
    - age
    - status
    - create_time
  
  # 分页最大每页数量（默认 500）
  maxPageSize: 3

logging:
  level:
    org.springframework.web: debug
    com.example.queryx.mapper: debug